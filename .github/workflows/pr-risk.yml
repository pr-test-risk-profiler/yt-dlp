name: PR Risk Profiler
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  risk-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run PR Test Risk Profiler
        uses: mov2day/pr-test-risk-profiler@v1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
