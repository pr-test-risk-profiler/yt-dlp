name: PR Risk Profiler
on:
  pull_request:
    types: [opened, synchronize]
    
permissions:
  contents: read
  pull-requests: write  # Required to post comments
  
jobs:
  risk-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run PR Test Risk Profiler
        uses: pr-test-risk-profiler/pr-test-risk-profiler@v1.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
